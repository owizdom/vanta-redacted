# vanta-watchable v0.1 — Minecraft visualizer stack.
#
# Three services: PaperMC server, headless NPC bots (mineflayer), and
# the browser-spectator viewer (mineflayer + prismarine-viewer). All
# subscribe to the VANTA runtime's existing public surface
# (`/api/events/stream` + `/api/state` + `/bridge/*`); runtime itself
# is NOT in this compose file — it runs separately on the host
# (`pnpm --filter @vanta/runtime start` with `WATCHABLE_ENABLED=1`).
#
# Service graph (this stack):
#   - paper     :25565 — PaperMC 1.21.4 + the vanta-bridge plugin
#   - npcs              — Wizard + 2 ambient bots (mineflayer)
#   - viewer    :8080  — WebGL canvas + chat panel on :8081
#
# Outside this stack:
#   - runtime   :8787  — VANTA core. Run via `pnpm start` on the host.
#                        Reachable from inside containers via
#                        host.docker.internal (auto on Docker Desktop;
#                        Linux needs the extra_hosts pin below).

services:
  paper:
    build:
      context: .
      dockerfile: Dockerfile.paper
    environment:
      # The bridge plugin reads this on enable() to know where to fetch
      # /api/events/stream + /api/state + /bridge/*.
      VANTA_RUNTIME_URL: http://host.docker.internal:8787
    ports:
      - "25565:25565"
    restart: unless-stopped
    volumes:
      - paper-world:/paper/world
      - paper-world-nether:/paper/world_nether
      - paper-world-the-end:/paper/world_the_end
    extra_hosts:
      # Linux needs an explicit pin; Docker Desktop on mac/win does
      # this automatically. Harmless on the platforms that already
      # provide it.
      - "host.docker.internal:host-gateway"

  npcs:
    build:
      context: .
      dockerfile: Dockerfile.npcs
    depends_on:
      paper:
        condition: service_started
    environment:
      PAPER_HOST: paper
      PAPER_PORT: "25565"
      RUNTIME_URL: http://host.docker.internal:8787
      MINECRAFT_VERSION: 1.21.4
      WIZARD_USERNAME: vanta
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  viewer:
    build:
      context: .
      dockerfile: Dockerfile.viewer
    depends_on:
      paper:
        condition: service_started
    environment:
      PAPER_HOST: paper
      PAPER_PORT: "25565"
      VIEWER_PORT: "8080"
      CHAT_PORT: "8081"
      VIEWER_USERNAME: CameraBot
    ports:
      - "8080:8080"
      - "8081:8081"
    restart: unless-stopped

volumes:
  paper-world:
  paper-world-nether:
  paper-world-the-end:
