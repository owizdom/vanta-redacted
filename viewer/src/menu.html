<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VANTA · the company you can walk inside</title>
  <link rel="stylesheet" href="/launcher.css" />
  <link rel="stylesheet" href="/console.css" />
  <style>
    /* Menu-specific overrides — the launcher's .nav-btn was styled for
     * <button> elements; here we use <a> so anchors get the same look. */
    .title-nav a.nav-btn {
      display: block;
      text-decoration: none;
      color: var(--fg);
      text-align: center;
      cursor: pointer;
    }
    .title-nav a.nav-btn.nav-quiet { color: var(--fg-dim); }
    .title-nav a.nav-btn:hover { text-decoration: none; }
  </style>
</head>
<body>
  <!-- Owner banner — the credibility primitive. Three addresses must match: -->
  <!-- TEE EOA ≡ LpVault.owner() ≡ LoanBook.owner(). Polls every 30s. -->
  <div class="owner-banner" id="owner-banner" data-state="loading">
    <div class="owner-dot"></div>
    <div class="owner-cells">
      <span class="owner-label">this enclave</span>
      <span class="owner-addr" id="owner-tee">0x…</span>
      <span class="owner-equiv">≡</span>
      <span class="owner-label">LpVault.owner()</span>
      <span class="owner-addr" id="owner-lp">0x…</span>
      <span class="owner-equiv">≡</span>
      <span class="owner-label">LoanBook.owner()</span>
      <span class="owner-addr" id="owner-lb">0x…</span>
    </div>
    <a class="owner-verify" href="/identity.html" target="_blank" rel="noopener">verify ↗</a>
  </div>

  <!-- Live world iframe behind everything; CSS controls the blur. -->
  <div class="world-bg" id="world-bg">
    <iframe src="http://localhost:8080/" title="VANTA world"></iframe>
  </div>

  <!-- Top-right HUD. v0.1: static "agent online"; v0.2 wires a real -->
  <!-- bot count when /api/town/state-equivalent lands. -->
  <div class="hud" id="hud">
    <div class="hud-row">
      <span class="hud-dot"></span>
      <span class="hud-label">live</span>
      <span class="hud-sep">·</span>
      <span id="hud-online">agent online</span>
    </div>
  </div>

  <!-- =================== Title screen =================== -->
  <section class="screen" data-screen="title" id="screen-title">
    <div class="title-stack">
      <h1 class="logo">V<span class="logo-thin">A</span>N<span class="logo-thin">T</span>A</h1>
      <div class="hero-card" id="hero-card">
        <div class="hero-cell">
          <div class="hero-num" id="hero-runway">—</div>
          <div class="hero-label">runway</div>
        </div>
        <div class="hero-cell">
          <div class="hero-num" id="hero-loans">—</div>
          <div class="hero-label">open loans</div>
        </div>
        <div class="hero-cell">
          <div class="hero-num" id="hero-last">—</div>
          <div class="hero-label" id="hero-last-label">last event</div>
        </div>
        <a class="hero-cell hero-link"
           href="https://sepolia.basescan.org/address/0xaa4875Ff1514b8227Dc61466473c0B1E4C83CAf9"
           target="_blank" rel="noopener"
           title="EigenCompute App ID — owner of the runtime that signs every quote">
          <div class="hero-num">enclave 0xaa48…3CAf9 ↗</div>
          <div class="hero-label">EigenCompute owner</div>
        </a>
      </div>
      <p class="logo-sub">an autonomous credit company · Base Sepolia · live</p>

      <nav class="title-nav">
        <a class="nav-btn nav-primary" href="/spectate#/mode">Play</a>
        <a class="nav-btn" href="http://localhost:3030/" target="_blank" rel="noopener">Console</a>
        <a class="nav-btn nav-quiet" href="/spectate">About</a>
      </nav>
    </div>
  </section>

  <script>
    // -------- helpers --------
    function truncateHex(hex, head, tail) {
      if (!hex || typeof hex !== 'string') return '—';
      const clean = hex.toLowerCase();
      const need = head + tail + 1;
      if (clean.length <= need) return clean;
      return clean.slice(0, head + 2) + '…' + clean.slice(-tail);
    }
    function humanAgo(secs) {
      if (!Number.isFinite(secs) || secs < 0) return '—';
      if (secs < 60)    return Math.floor(secs) + 's ago';
      if (secs < 3600)  return Math.floor(secs / 60) + 'm ago';
      if (secs < 86400) return Math.floor(secs / 3600) + 'h ago';
      return Math.floor(secs / 86400) + 'd ago';
    }
    function fmtUsd(usdc6) {
      if (usdc6 === undefined || usdc6 === null) return '$—';
      try {
        const whole = BigInt(usdc6) / 1000000n;
        return '$' + Number(whole).toLocaleString('en-US');
      } catch (_) { return '$—'; }
    }

    // -------- stats: /api/state every 8s --------
    async function refreshStats() {
      const runway = document.getElementById('hero-runway');
      const loans = document.getElementById('hero-loans');
      const last = document.getElementById('hero-last');
      const lastLabel = document.getElementById('hero-last-label');
      try {
        const r = await fetch('/api/state', { cache: 'no-store' });
        if (!r.ok) {
          [runway, loans, last].forEach((el) => el && el.classList.add('is-stale'));
          return;
        }
        const d = await r.json();
        if (runway) {
          // /api/state exposes runway_days (treasury balance / weekly spend
          // × 7). Format as "Nd" or "N.Nd" — fits the same visual slot as
          // a $ figure but doesn't pretend to be one.
          const days = typeof d.runway_days === 'number' ? d.runway_days : null;
          runway.textContent = days === null ? '—' : (days >= 365 ? '1y+' : days + 'd');
          runway.classList.remove('is-stale');
        }
        if (loans) {
          loans.textContent = String(Array.isArray(d.positions) ? d.positions.length : 0);
          loans.classList.remove('is-stale');
        }
        if (last && lastLabel) {
          const ld = d.last_decision;
          if (ld && typeof ld.age_s === 'number') {
            last.textContent = humanAgo(ld.age_s);
            const t = String(ld.type || 'event');
            if (t === 'loan.settlement' || t === 'loan.liquidation') {
              lastLabel.textContent = 'last settlement';
            } else if (t === 'treasury.inflow') {
              lastLabel.textContent = 'last inflow';
            } else if (t === 'loan.origination') {
              lastLabel.textContent = 'last origination';
            } else if (t === 'loop.credit_tick') {
              lastLabel.textContent = 'last credit tick';
            } else if (t.startsWith('loop.')) {
              lastLabel.textContent = 'last ' + t.replace('loop.', '').replace(/_/g, ' ');
            } else {
              lastLabel.textContent = 'last event';
            }
            last.classList.remove('is-stale');
          } else {
            last.textContent = '—';
            lastLabel.textContent = 'last event';
          }
        }
      } catch (_) {
        [runway, loans, last].forEach((el) => el && el.classList.add('is-stale'));
      }
    }

    // -------- owner banner: /api/identity-pin every 30s --------
    async function refreshOwner() {
      const banner = document.getElementById('owner-banner');
      if (!banner) return;
      const teeEl = document.getElementById('owner-tee');
      const lpEl = document.getElementById('owner-lp');
      const lbEl = document.getElementById('owner-lb');
      try {
        const r = await fetch('/api/identity-pin', { cache: 'no-store' });
        if (!r.ok) {
          banner.setAttribute('data-state', 'pending');
          return;
        }
        const d = await r.json();
        const tee = d.tee_address || '';
        const lp = d.lp_vault_owner || '';
        const lb = d.loan_book_owner || '';
        if (teeEl) teeEl.textContent = tee ? truncateHex(tee, 6, 4) : '—';
        if (lpEl) lpEl.textContent = lp ? truncateHex(lp, 6, 4) : '—';
        if (lbEl) lbEl.textContent = lb ? truncateHex(lb, 6, 4) : '—';
        if (lp === '' || lb === '') {
          banner.setAttribute('data-state', 'pending');
          return;
        }
        banner.setAttribute('data-state', d.all_match === true ? 'ok' : 'mismatch');
      } catch (_) {
        banner.setAttribute('data-state', 'pending');
      }
    }

    refreshStats();
    refreshOwner();
    setInterval(refreshStats, 8000);
    setInterval(refreshOwner, 30000);
  </script>
</body>
</html>
